[project]
name = "SQLDemo"
version = "0.1.0"
description = "Template repository for Python projects with uv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupysql>=0.11.1",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
